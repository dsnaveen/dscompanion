[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dscompanion"
version = "0.1.2"
description = "A production-grade ML pipeline toolkit: EDA, feature engineering, model training/tuning/calibration, and governance-ready model cards."
readme = "README.md"
authors = [{ name = "dsnaveen", email = "mailtonaveenmittal@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.2,<4",          # 2.x and 3.x both supported — 3.x makes Copy-on-Write mandatory
                               # (harmless here; the same CoW-safe .loc[]/copy patterns already
                               # used for 2.x cover it). Tested against 3.0.5.
    "pyarrow>=14.0",           # parquet is DataConfig's default format — pandas needs an
                               # engine (pyarrow or fastparquet) for read_parquet/to_parquet,
                               # neither of which ships with pandas itself
    "numpy>=2.1,<2.6",         # upper-bounded to match numba's own declared numpy ceiling —
                               # numba is a transitive shap dependency (shap itself only pins
                               # numba>=0.54, no ceiling) and older numba builds (<0.67) don't
                               # support numpy>=2.4. Tested against numpy 2.5.3 + numba 0.67.0.
    "scikit-learn>=1.7,<2",
    "scipy>=1.16,<2",
    "statsmodels>=0.14,<0.15",
    "joblib>=1.4,<2",
    "plotly>=5.20,<6",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "pydantic>=2.10,<2.11",    # v2 native — BaseSettings lives in pydantic-settings.
                               # Narrowly bounded (not just <3): pydantic's generated JSON
                               # schema shape has changed across minor versions before, and
                               # api/openapi.json is committed and snapshot-tested against it.
    "pydantic-settings>=2.10,<3",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "xgboost>=3.0,<4",         # macOS dev requires Homebrew libomp (conda-forge llvm-openmp)
    "optuna>=3.6,<4",
    "shap>=0.44,<0.52",        # pre-0.52 API — shap_explainer.py returns list-of-arrays branch;
                               # shap 0.52.0+ returns a 3-D ndarray instead
    # imbalanced-learn is intentionally not a dependency — ImbalanceHandler's smote/undersample
    # strategies are implemented from scratch on scikit-learn's NearestNeighbors alone, since
    # imbalanced-learn has a history of version conflicts with recent scikit-learn releases.
    "python-docx>=1.1,<2",
    "xlsxwriter>=3.2,<4",      # engine for ModelCard.to_excel()
    "openpyxl>=3.1,<4",        # engine for DataConfig's format="excel" (pd.read_excel)
]

[project.urls]
Homepage = "https://github.com/dsnaveen/dscompanion"
Repository = "https://github.com/dsnaveen/dscompanion"
Issues = "https://github.com/dsnaveen/dscompanion/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "black==26.3.1", "ruff==0.15.16", "httpx>=0.27"]
databricks = ["pyspark==4.0.0", "databricks-sdk>=0.20"]
# Doc build tooling only — never imported by dscompanion's runtime code.
docs = ["sphinx>=9.0", "furo>=2025.0", "sphinx-autodoc-typehints>=3.0", "myst-parser>=5.0"]
# Local-dev UI only — drives PipelineRunner from a browser on a dev machine against
# local data. app/ is never imported by dscompanion's runtime code, so this
# extra is optional even for full local development.
app = ["streamlit==1.59.1"]
# Optional FastAPI service exposing PipelineRunner over HTTP, for a web-based
# frontend. Not required for using dscompanion as a library.
api = ["fastapi==0.117.1", "uvicorn==0.37.0"]
# Optional gradient-boosting backend for ModelFactory's "lightgbm" algorithm choice —
# not required unless that specific algorithm is selected.
models = ["lightgbm==4.6.0"]
# Tooling for notebooks/ — the learning/tutorial notebooks, never imported by
# dscompanion's runtime code.
notebooks = ["ucimlrepo>=0.0.7", "jupyter>=1.0", "ipykernel>=6.29"]
# Optional MCP (Model Context Protocol) server exposing dscompanion as agent-callable
# tools — runs entirely locally (stdio transport), no data leaves the user's machine.
# Not required for using dscompanion as a library. sse-starlette pinned <3.0: 3.4.11
# (the default resolution otherwise) requires starlette>=0.49.1, which removed the
# on_startup kwarg fastapi==0.117.1's APIRouter still passes — breaks the `api` extra
# if both are installed together. sse-starlette<3.0 (confirmed with 2.4.1) has no such
# floor and works fine with both mcp and fastapi.
mcp = ["mcp>=1.0", "sse-starlette<3.0"]
# Convenience extra bundling every other extra above -- used by the Docker image
# (see Dockerfile) so it never needs updating when a new extra is added later.
all = ["dscompanion[dev,databricks,docs,app,api,models,notebooks,mcp]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dscompanion*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (F401 = unused imports, F403 = wildcard imports)
    "W",      # pycodestyle warnings
    "I",      # isort import order
    "UP006",  # List[X] → list[X]
    "UP007",  # Optional[X] → X | None
    "UP035",  # deprecated typing imports
    "T201",   # print() call
    "F403",   # wildcard imports
    "RUF100", # unused noqa directives
]
ignore = [
    # This project requires `logger = logging.getLogger(__name__)` immediately
    # after `import logging`, before all third-party imports — E402 flags exactly
    # that placement as "import not at top of file". The convention is correct
    # and deliberate, so this rule is disabled project-wide.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Not pytest-collected — a manual, human-run CLI script (see its own docstring).
# print() is the actual intended output mechanism here, not a logging omission.
"tests/manual_verify_interactive_flow.py" = ["T201"]
"tests/manual_verify_leaderboard_tuning.py" = ["T201"]
"tests/manual_verify_environment.py" = ["T201"]
# Tutorial notebooks: print()/bare-expression output is the normal, intended way to
# show results to a reader, and imports are deliberately placed right before their
# first use per section rather than all at the top of the file.
"notebooks/*.ipynb" = ["T201", "I001"]

[tool.mypy]
# Placeholder — strict type-checking disabled for now; enable incrementally
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dscompanion --cov-report=term-missing --cov-fail-under=80"
