name: dscompanion-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12

  - pandas=2.3.3
  - numpy=2.3.5              # pinned for numba 0.62.1 compatibility
  - scikit-learn=1.9.0

  # Utilities
  - scipy=1.18.1
  - statsmodels=0.14.6
  - joblib=1.5.3
  - plotly=5.24.1
  - jinja2=3.1.5
  - pyyaml=6.0.2

  # Dev tooling
  - pytest=8.3.5
  - pytest-cov=4.1.0

  # Visualisation
  - matplotlib=3.11.1
  - seaborn=0.13.2

  # Pre-built C-extension packages — installing via conda avoids cmake/LLVM build failures
  - numba=0.62.*              # shap dep; matches the numpy==2.3.5 compat pin above

  - pip
  - pip:
      # pip-only packages pinned to match dscompanion/pyproject.toml
      - pydantic==2.10.6
      - pydantic-settings==2.15.0
      - xgboost==3.0.0        # macOS dev requires Homebrew libomp (conda-forge llvm-openmp)
      - optuna==3.6.1
      - shap==0.47.1
      - python-docx==1.2.0
      - xlsxwriter==3.2.9
