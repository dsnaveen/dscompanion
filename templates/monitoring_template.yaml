# ─────────────────────────────────────────────────────────────────────────────
# dscompanion Monitoring Job Config Template
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED fields are marked with  ← REQUIRED
# Everything else has a safe default and can be left as-is or deleted.
# Pass this file to MonitoringRunner.from_yaml("path/to/this.yaml").run()
#
# Re-measures a PAST ScoringRunner batch's performance against actuals that have
# since arrived, and (optionally) checks feature-level drift (CSI) against the
# training-time reference. See templates/scoring_template.yaml for producing
# scored_data in the first place, and templates/experiment_template.yaml for
# training the model that produced scoring_pipeline_path below.
#
# IMPORTANT: id_columns below MUST match the id_columns the ORIGINAL ScoringRunner
# run used to produce scored_data — if that run didn't set id_columns, there is no
# join key here and this config cannot be used.
#
# Every key below is a real MonitoringConfig field — MonitoringConfig uses
# extra="forbid", so any key NOT in its schema raises a ValidationError before a
# monitoring run runs. If a from_yaml() load ever fails with "Extra inputs are not
# permitted", a field here has drifted from dscompanion/monitoring/config.py and
# should be fixed here, not worked around by deleting the validation.
# ─────────────────────────────────────────────────────────────────────────────

name: credit_risk_baseline_v1_monitoring_2026_10   # ← REQUIRED: monitoring job name
version: "1.0"

# ← REQUIRED: same ScoringPipeline bundle used to produce scored_data below —
# supplies the training-time reference for both the "psi" performance metric
# (psi_reference_) and feature-level CSI (feature_reference_).
scoring_pipeline_path: ./reports/20260101_000000/model/credit_risk_baseline_v1_v1.0_scoring_pipeline.joblib

# ── Scored data ──────────────────────────────────────────────────────────────
# A past ScoringRunner output file — must contain id_columns..., "prediction",
# and (classification only) "probability" — ScoringPipeline.predict()'s exact,
# fixed output column convention, not independently configurable here.
scored_data:
  path: ./scoring_runs/20260901_120000/scored.parquet   # ← REQUIRED
  format: parquet                    # parquet | csv | excel | delta

# ── Actuals data ─────────────────────────────────────────────────────────────
# The separately-arrived actual outcomes for that same batch.
actuals_data:
  path: abfss://container@account.dfs.core.windows.net/actuals/2026_10_default_flags.parquet  # ← REQUIRED
  format: parquet
  target_column: default_flag   # ← REQUIRED: name of the actual-outcome column in this file

# ── Raw feature data (optional — enables feature-level drift/CSI) ───────────
# The SAME batch's raw feature data, for ScoringPipeline.compute_feature_drift().
# Omit this whole section entirely to skip feature-drift reporting and only get
# the performance report.
# raw_data:
#   path: abfss://container@account.dfs.core.windows.net/features/2026_10_applications.parquet
#   format: parquet

# ← REQUIRED: join key(s) across scored_data / actuals_data / raw_data — must
# match the id_columns used on the original ScoringRunner run (see note above).
id_columns:
  - application_id

# ── Output ────────────────────────────────────────────────────────────────────
output:
  output_dir: ./monitoring_runs      # a timestamped <output_dir>/<run_id>/ folder is created per
                                     # run (same IST-timestamped convention as PipelineRunner's
                                     # and ScoringRunner's runs) — containing the performance
                                     # report, a copy of this resolved config, this run's log, and
                                     # feature_drift_report.<ext> when raw_data is set above.
  format: csv                        # csv | parquet | excel — format of the written report files
